<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тетрис</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; align-items: center; height: 100%; padding: 8px; gap: 8px; }
  #score { font-size: 16px; font-weight: bold; }
  #wrap { position: relative; flex: 1; min-height: 0; aspect-ratio: 1 / 2; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; border: 2px solid #fff; background: #141414; }
  #over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: rgba(150,0,0,.6); font-size: 24px; gap: 12px; text-align: center; }
  #over button { font-size: 18px; padding: 10px 22px; border-radius: 10px; border: 2px solid #fff; background: transparent; color: #fff; }
  #pad { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 56px); gap: 8px; padding-bottom: 8px; }
  #pad button { font-size: 26px; border: none; border-radius: 12px; background: #333; color: #fff; }
  #pad button:active { background: #666; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #drop { grid-column: 3; grid-row: 1; font-size: 16px !important; }
</style>
</head>
<body>
<div id="app">
  <div id="score">Счёт: 0 · Линии: 0 · Уровень: 0</div>
  <div id="wrap">
    <canvas id="c" width="300" height="600"></canvas>
    <div id="over"><div>Игра окончена</div><button id="restart">Заново</button></div>
  </div>
  <div id="pad">
    <button id="up">⬆</button>
    <button id="drop">Сброс</button>
    <button id="left">⬅</button>
    <button id="down">⬇</button>
    <button id="right">➡</button>
  </div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); } catch (e) {} }

const W = 10, H = 20, B = 30;
const SHAPES = [
  [[[1,1,1,1]], '#00dcdc'],
  [[[1,0,0],[1,1,1]], '#2850e6'],
  [[[0,0,1],[1,1,1]], '#e6961e'],
  [[[1,1],[1,1]], '#e6d21e'],
  [[[0,1,1],[1,1,0]], '#28c846'],
  [[[0,1,0],[1,1,1]], '#aa32d2'],
  [[[1,1,0],[0,1,1]], '#dc2d2d'],
];
const ctx = document.getElementById('c').getContext('2d');
const scoreEl = document.getElementById('score');
const overEl = document.getElementById('over');

let grid, score, over, cur, lines, level, timer;

function reset() {
  grid = Array.from({ length: H }, () => Array(W).fill(null));
  score = 0; lines = 0; level = 0; over = false;
  setSpeed();
  overEl.style.display = 'none';
  spawn(); draw();
}

function spawn() {
  const [shape, color] = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  cur = { shape: shape.map(r => r.slice()), color, x: Math.floor(W / 2 - shape[0].length / 2), y: 0 };
  if (!valid(cur, 0, 0)) endGame();
}

function valid(f, dx, dy, shape = f.shape) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const x = f.x + c + dx, y = f.y + r + dy;
      if (x < 0 || x >= W || y >= H) return false;
      if (y >= 0 && grid[y][x]) return false;
    }
  return true;
}

function move(dx, dy) {
  if (over) return false;
  if (valid(cur, dx, dy)) { cur.x += dx; cur.y += dy; draw(); return true; }
  if (dy > 0) lock();
  return false;
}

function rotate() {
  if (over) return;
  const s = cur.shape;
  const rot = s[0].map((_, c) => s.map(row => row[c]).reverse());
  if (valid(cur, 0, 0, rot)) { cur.shape = rot; draw(); }
}

function lock() {
  for (let r = 0; r < cur.shape.length; r++)
    for (let c = 0; c < cur.shape[r].length; c++)
      if (cur.shape[r][c]) {
        const x = cur.x + c, y = cur.y + r;
        if (y < 0) return endGame();
        grid[y][x] = cur.color;
      }
  const rest = grid.filter(row => row.some(v => !v));
  const cleared = H - rest.length;
  grid = Array.from({ length: cleared }, () => Array(W).fill(null)).concat(rest);
  score += [0, 100, 300, 500, 800][cleared];
  lines += cleared;
  const newLevel = calcLevel(lines);
  if (newLevel !== level) { level = newLevel; setSpeed(); }
  if (cleared && tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  spawn(); draw();
}

function drop() { while (!over && move(0, 1)); }

function endGame() {
  over = true;
  overEl.style.display = 'flex';
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
}

function block(x, y, color) {
  ctx.fillStyle = color; ctx.fillRect(x * B, y * B, B, B);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x * B + .5, y * B + .5, B - 1, B - 1);
}

function draw() {
  ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, W * B, H * B);
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      if (grid[y][x]) block(x, y, grid[y][x]);
      else { ctx.strokeStyle = '#373737'; ctx.strokeRect(x * B + .5, y * B + .5, B - 1, B - 1); }
    }
  if (!over)
    cur.shape.forEach((row, r) => row.forEach((v, c) => { if (v) block(cur.x + c, cur.y + r, cur.color); }));
  scoreEl.textContent = 'Счёт: ' + score + ' · Линии: ' + lines + ' · Уровень: ' + level;
}

// Скорость: 500 мс; после 10 линий быстрее, затем каждые 15 линий ещё быстрее
function calcLevel(n) { return n < 10 ? 0 : 1 + Math.floor((n - 10) / 15); }
function setSpeed() {
  clearInterval(timer);
  const ms = Math.max(100, 500 - level * 60);
  timer = setInterval(() => { if (!over) move(0, 1); }, ms);
}

// Кнопки 
function bind(id, action, repeat) {
  const el = document.getElementById(id);
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); action();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    if (repeat) { t1 = setTimeout(() => { t2 = setInterval(action, 90); }, 250); }
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
}
bind('left', () => move(-1, 0), true);
bind('right', () => move(1, 0), true);
bind('down', () => move(0, 1), true);
bind('up', rotate, false);
bind('drop', drop, false);
document.getElementById('restart').addEventListener('click', reset);

// Клавиатура 
document.addEventListener('keydown', e => {
  if (over) { if (e.key === 'r') reset(); return; }
  if (['ArrowLeft', 'a'].includes(e.key)) move(-1, 0);
  else if (['ArrowRight', 'd'].includes(e.key)) move(1, 0);
  else if (['ArrowUp', 'w'].includes(e.key)) rotate();
  else if (e.key === 'ArrowDown') move(0, 1);
  else if (e.key === ' ') drop();
});

reset();
</script>
</body>
</html>
